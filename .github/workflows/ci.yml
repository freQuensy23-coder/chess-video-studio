name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2 fonts-dejavu-core stockfish
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run chess-video showcase --output output/showcase.mp4 --width 608 --height 1080 --fps 24
      - run: uv run python scripts/verify_media.py output/showcase.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animation-showcase
          path: output/
          if-no-files-found: ignore
